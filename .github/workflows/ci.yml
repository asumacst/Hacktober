# Pruebas de todas las capas en cada push y PR. Sin red hacia Gemini ni claves:
# las pruebas no deben consumir cuota de la API (AGENTS.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q
